# Dataset type
type: eobs_mch

# Path to .nc data file. Must be overridden.
data_path: null

# Path to json stats file. Must be overriden.
stats_path: null

# Names or indices of input channels
input_variables: ['t', 't_min', 't_max', 'tp']

# Names or indices of output channels
output_variables: ['t', 't_min', 't_max', 'tp']

# Names or indices of invariant channels. Optional.
invariant_variables: null

# Period from which the data is supposed to be taken. Optional; default 'train-period'.
period: null

# Path to store temporary data files. Optional; the default is set to `./tmp`.
tmp_path: null
